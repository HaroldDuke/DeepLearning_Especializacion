# Configuración de Sweep para Weights & Biases
#
# Cómo usar:
#   1. wandb sweep sweep.yaml           # devuelve un SWEEP_ID
#   2. wandb agent <SWEEP_ID> --count 6 # ejecuta 6 runs con combinaciones distintas
#
# Esto le da al equipo material para comparar runs en el dashboard
# y demostrar exploración sistemática de hiperparámetros.

program: train.py
method: bayes        # 'bayes' es más eficiente que 'grid' o 'random'

metric:
  name: val_accuracy
  goal: maximize

parameters:
  epochs:
    value: 8
  batch_size:
    values: [32, 64, 128]
  learning_rate:
    min: 0.0001
    max: 0.01
  optimizer:
    values: ["adam", "sgd", "rmsprop"]
  num_filters:
    values: [16, 32, 64]
  dense_units:
    values: [64, 128, 256]
  dropout:
    min: 0.2
    max: 0.5

early_terminate:
  type: hyperband
  min_iter: 3
